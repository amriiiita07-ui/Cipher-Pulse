version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cipherpulse-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cipherpulse
      POSTGRES_PASSWORD: cipherpulse_secret
      POSTGRES_DB: cipherpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
